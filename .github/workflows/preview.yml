name: Deploy Branch Preview

# publish-pages.yml deploys the complete gh-pages branch after this succeeds.

on:
  # Manual only: pick the branch to preview in the Actions tab "Run workflow"
  # dropdown. github.ref_name resolves to whatever branch you select.
  workflow_dispatch:

# Pushing to the gh-pages branch needs write access to repo contents
permissions:
  contents: write

# Shared with deploy.yml so the two never push to gh-pages simultaneously.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Compute preview slug
        id: slug
        # Sanitize the branch name into a single path segment (e.g.
        # feature/foo -> feature-foo) so it maps to one preview folder. The name
        # goes through env, not ${{ }} in the script, so it can't inject shell.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "slug=$(printf '%s' "$REF_NAME" | sed 's#[^a-zA-Z0-9._-]#-#g')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bun run build
        env:
          VITE_BASE_PATH: /keychain-maker/preview/${{ steps.slug.outputs.slug }}/

      - name: Publish to gh-pages (preview subfolder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview/${{ steps.slug.outputs.slug }}
          # Don't wipe production or other previews.
          keep_files: true

      - name: Preview URL
        run: |
          echo "### Preview build ready" >> "$GITHUB_STEP_SUMMARY"
          echo "The Publish GitHub Pages workflow will deploy this build after this workflow succeeds." >> "$GITHUB_STEP_SUMMARY"
          echo "https://andzhik.github.io/keychain-maker/preview/${{ steps.slug.outputs.slug }}/" >> "$GITHUB_STEP_SUMMARY"
