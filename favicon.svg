<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .ring { stroke: #6b7280; }
    .tag { fill: #1f2937; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #9ca3af; }
      .tag { fill: #e5e7eb; }
    }
  </style>
  <mask id="hole">
    <rect width="32" height="32" fill="#fff" />
    <circle cx="15" cy="15" r="2.3" fill="#000" />
  </mask>
  <!-- The split ring sits behind the tag, so it shows through the hole. -->
  <circle class="ring" cx="9.8" cy="9.8" r="7.3" fill="none" stroke-width="2.6" />
  <g mask="url(#hole)">
    <rect class="tag" x="13.75" y="9.75" width="12.5" height="20.5" rx="4.5" transform="rotate(-45 20 20)" />
  </g>
  <path d="M20.5 24.4 16.2 20.2a2.6 2.6 0 0 1 4.3-2.9 2.6 2.6 0 0 1 4.3 2.9Z" fill="#f87171" />
</svg>
