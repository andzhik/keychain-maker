name: Publish GitHub Pages

# A GITHUB_TOKEN push to gh-pages does not trigger a Pages build. Deploy the
# complete branch explicitly after either producer finishes successfully.
on:
  workflow_run:
    workflows: [Deploy GitHub Pages, Deploy Branch Preview]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Also shared by the producers: never snapshot gh-pages during a publish.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # workflow_run executes on master, so branch previews can use the existing
    # Pages environment's deployment policy without granting feature branches access.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Checkout published site
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live production and previews
        run: node .github/scripts/verify-pages.mjs "$SITE_URL" site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
