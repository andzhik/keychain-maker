name: Deploy GitHub Pages

# Production is stored at the gh-pages branch root; branch previews (preview.yml)
# live under preview/<slug>/. publish-pages.yml deploys the complete branch using
# the Pages API after this workflow succeeds (Settings → Pages → GitHub Actions).

on:
  push:
    branches: [master]
  workflow_dispatch:

# Pushing to the gh-pages branch needs write access to repo contents
permissions:
  contents: write

# Shared with preview.yml so the two never push to gh-pages simultaneously.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          VITE_BASE_PATH: /keychain-maker/

      # The publish below replaces the whole branch (so stale production assets
      # don't pile up); carry the existing previews over into it first.
      - name: Keep branch previews
        run: |
          if git fetch --depth=1 origin gh-pages; then
            git archive FETCH_HEAD preview | tar -x -C dist || echo "No previews to keep"
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
